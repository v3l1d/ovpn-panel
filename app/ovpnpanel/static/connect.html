<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Set up your VPN</title>
<style>
  :root { color-scheme: light dark; --bg:#f4f6f8; --surface:#fff; --line:#e1e6eb; --text:#16202a; --muted:#5d6b78;
          --accent:#c2560c; --on-accent:#fff; --soft:#fdeedf; --danger:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1317; --surface:#171c22; --line:#28313a; --text:#e9eef2; --muted:#96a3af;
            --accent:#fb923c; --on-accent:#2b1404; --soft:#3a2312; --danger:#f0776b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px;
         background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width:100%; max-width:440px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:28px 24px; }
  .logo { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--soft); color:var(--accent); margin-bottom:16px; }
  .logo.bad { color:var(--danger); background:color-mix(in srgb, var(--danger) 14%, transparent); }
  h1 { font-size:22px; line-height:1.25; margin:0 0 4px; }
  p { margin:0; }
  .muted { color:var(--muted); font-size:14px; }
  ol { list-style:none; margin:24px 0 0; padding:0; display:grid; gap:18px; }
  li { display:grid; grid-template-columns:28px 1fr; gap:12px; }
  .n { width:28px; height:28px; border-radius:50%; background:var(--soft); color:var(--accent); display:grid; place-items:center; font-size:14px; font-weight:600; }
  li strong { display:block; font-weight:600; }
  a.btn { display:block; text-align:center; margin-top:10px; padding:12px 16px; border-radius:10px; background:var(--accent); color:var(--on-accent);
          font-weight:600; text-decoration:none; }
  a.link { color:var(--accent); }
  footer { margin-top:24px; padding-top:16px; border-top:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <div class="logo" id="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div>
  <h1 id="title">Set up your VPN</h1>
  <p class="muted" id="sub">Loading…</p>
  <ol id="steps" hidden>
    <li><span class="n">1</span><div><strong>Install OpenVPN Connect</strong>
      <a class="link" href="https://openvpn.net/client/" target="_blank" rel="noreferrer">Get the app</a></div></li>
    <li><span class="n">2</span><div><strong>Download your profile</strong><a class="btn" id="dl"></a></div></li>
    <li><span class="n">3</span><div><strong>Import and connect</strong>
      <p class="muted">Open the file with OpenVPN Connect, tap Import, then Connect. On a computer you can drag it into the app.</p></div></li>
  </ol>
  <footer id="foot" hidden><p class="muted" id="exp"></p></footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = encodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
(async () => {
  const r = await fetch(`/dl/${token}/info`, { cache: "no-store" }).catch(() => null);
  if (!r || !r.ok) {
    $("logo").classList.add("bad");
    $("title").textContent = "This link is not valid";
    $("sub").textContent = "It has expired or the access was revoked. Ask your administrator for a new link.";
    return;
  }
  const p = await r.json();
  $("sub").textContent = `Profile for ${p.name}`;
  $("dl").href = `/dl/${token}`; $("dl").download = p.filename; $("dl").textContent = `Download ${p.filename}`;
  $("steps").hidden = false;
  $("exp").textContent = "This link is personal: do not forward it. It expires on " +
    new Date(p.expires_at * 1000).toLocaleString(undefined, { dateStyle: "short", timeStyle: "short" }) + ".";
  $("foot").hidden = false;
})();
</script>
</body>
</html>
