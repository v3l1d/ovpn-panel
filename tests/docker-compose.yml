# Ambiente di prova: vedi tests/run.sh
name: ovpn-panel-test

services:
  pve:
    build: ./pve-sim
    hostname: pve
    privileged: true          # systemd + tun + iptables, come in un container LXC
    cgroup: host
    tmpfs: [/run, /run/lock]
    volumes:
      - ../dist:/dist:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "9443:8443/tcp"       # pannello: https://localhost:9443
      - "1195:1194/udp"       # OpenVPN

  e2e:
    build: ./e2e
    profiles: [test]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    environment:
      PANEL_URL: https://pve:8443
      CA_FILE: /cache/tls.crt
      ADMIN_USER: admin
    volumes:
      - ./.cache:/cache:ro
