# Test environment: see tests/run.sh
name: ovpn-panel-test

services:
  pve:
    build: ./pve-sim
    hostname: pve
    privileged: true          # systemd + tun + iptables, as in an LXC container
    cgroup: host
    tmpfs: [/run, /run/lock]
    volumes:
      - ../dist:/dist:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "9443:8443/tcp"       # panel: https://localhost:9443
      - "1195:1194/udp"       # OpenVPN

  e2e:
    build: ./e2e
    profiles: [test]
    privileged: true          # a second OpenVPN client runs in its own network namespace
    environment:
      PANEL_URL: https://pve:8443
      CA_FILE: /cache/panel-ca.crt
      ADMIN_USER: admin
    volumes:
      - ./.cache:/cache
